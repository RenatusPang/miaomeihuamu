# Pages CMS configuration; JSON syntax is valid YAML.
{
  "media": [
    {
      "name": "work_images",
      "label": "图片素材",
      "input": "assets",
      "output": "/assets",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ],
      "rename": "safe"
    },
    {
      "name": "work_videos",
      "label": "作品视频",
      "input": "assets/uploads/videos",
      "output": "/assets/uploads/videos",
      "extensions": [
        "mp4",
        "webm"
      ],
      "rename": "safe"
    }
  ],
  "settings": {
    "content": {
      "merge": true
    }
  },
  "content": [
    {
      "name": "home",
