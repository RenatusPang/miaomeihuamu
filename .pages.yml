media:
  - name: work_images
    label: 作品图片
    input: assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
  - name: work_videos
    label: 作品视频
    input: assets/uploads/videos
    output: /assets/uploads/videos
    categories: [video]

content:
  - name: home
    label: 首页封面设置
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero_image
        label: 首页模特封面图
        type: image
        required: true
        options: { media: work_images }
      - { name: hero_alt, label: 图片说明（给搜索和无障碍使用）, type: string, required: true }
      - { name: hero_badge, label: 图片左下角文字, type: string, required: true }
      - { name: hero_alt_en, label: 英文图片说明, type: string }
      - { name: hero_badge_en, label: 英文图片说明文字, type: string }

  - name: women_brow
    label: 女士野生眉作品
    type: file
    path: content/works/women-brow.json
    format: json
    list: true
    fields: &work_fields
      - { name: title, label: 展示标题, type: string, required: true }
      - { name: description, label: 作品说明（只写已确认的设计事实）, type: string }
      - { name: title_en, label: 英文展示标题, type: string }
      - { name: description_en, label: 英文作品说明（只写已确认的设计事实）, type: string }
      - { name: alt_en, label: 英文图片说明, type: string }
      - name: image
        label: 图片（图片作品填写）
        type: image
        options: { media: work_images }
      - name: video
        label: 视频（视频作品填写）
        type: file
        options: { media: work_videos, extensions: [mp4, webm] }
      - { name: alt, label: 图片说明（给搜索和无障碍使用）, type: string }
      - { name: published, label: 允许公开展示, type: boolean, default: true }
      - { name: featured, label: 首页展示, type: boolean, default: false }
      - { name: wide, label: 宽版展示, type: boolean, default: false }

  - name: men_brow
    label: 男士野生眉作品
    type: file
    path: content/works/men-brow.json
    format: json
    list: true
    fields: *work_fields
  - name: eyeliner
    label: 美瞳线作品
    type: file
    path: content/works/eyeliner.json
    format: json
    list: true
    fields: *work_fields
  - name: lip_extension
    label: 扩唇作品
    type: file
    path: content/works/lip-extension.json
    format: json
    list: true
    fields: *work_fields
  - name: dark_lip_correction
    label: 改乌唇作品
    type: file
    path: content/works/dark-lip-correction.json
    format: json
    list: true
    fields: *work_fields
  - name: philtrum
    label: 人中窝作品
    type: file
    path: content/works/philtrum.json
    format: json
    list: true
    fields: *work_fields
  - name: hairline
    label: 纹发际线作品
    type: file
    path: content/works/hairline.json
    format: json
    list: true
    fields: *work_fields
